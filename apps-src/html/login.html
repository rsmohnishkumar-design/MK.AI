<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Page</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #f97316, #db2777); font-family: system-ui, sans-serif; }
  .card { width: min(360px, 92vw); background: #fff; border-radius: 18px; padding: 28px; box-shadow: 0 12px 30px #0003; }
  h1 { margin: 0 0 18px; text-align: center; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border: 2px solid #eee; border-radius: 10px; }
  input:focus { border-color: #db2777; outline: none; }
  .show { font-size: 14px; margin-top: 6px; }
  button { width: 100%; margin-top: 18px; padding: 12px; font-size: 17px; border: 0; border-radius: 10px; background: #db2777; color: #fff; cursor: pointer; }
  .error { color: #dc2626; font-size: 14px; min-height: 18px; margin-top: 8px; }
  .switch { text-align: center; margin-top: 14px; font-size: 14px; }
</style>
</head>
<body>
<form class="card" id="form" novalidate>
  <h1>Welcome back 👋</h1>
  <label for="email">Email</label>
  <input id="email" type="email" placeholder="you@example.com">
  <label for="password">Password</label>
  <input id="password" type="password" placeholder="At least 8 characters">
  <label class="show"><input type="checkbox" id="showPw" style="width:auto"> Show password</label>
  <div class="error" id="error"></div>
  <button>Log in</button>
  <div class="switch">No account? <a href="#">Sign up</a></div>
</form>
<script>
  // This page only checks the form. To really log people in, connect it to a
  // service like Firebase Authentication — never store passwords yourself.
  document.getElementById("showPw").onchange = (e) => (document.getElementById("password").type = e.target.checked ? "text" : "password");
  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const pw = document.getElementById("password").value;
    const error = document.getElementById("error");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) error.textContent = "Please enter a valid email.";
    else if (pw.length < 8) error.textContent = "Password must be at least 8 characters.";
    else { error.style.color = "#16a34a"; error.textContent = "Looks good! ✅ (connect a real login service next)"; }
  });
</script>
</body>
</html>
