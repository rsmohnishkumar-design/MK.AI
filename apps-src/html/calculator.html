<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1e1e2f; font-family: system-ui, sans-serif; }
  .calc { width: min(320px, 92vw); background: #2b2b40; border-radius: 20px; padding: 18px; box-shadow: 0 10px 30px #0008; }
  .screen { background: #14141f; color: #fff; border-radius: 12px; padding: 14px; text-align: right; margin-bottom: 14px; }
  .prev { color: #8a8aa8; min-height: 20px; font-size: 14px; }
  .now { font-size: 34px; overflow-x: auto; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button { padding: 18px 0; font-size: 20px; border: 0; border-radius: 12px; background: #3a3a55; color: #fff; cursor: pointer; }
  button:active { transform: scale(0.96); }
  .op { background: #f0a500; color: #1e1e2f; }
  .eq { background: #4caf50; grid-column: span 2; }
  .clear { background: #e57373; }
</style>
</head>
<body>
<div class="calc">
  <div class="screen"><div class="prev" id="prev"></div><div class="now" id="now">0</div></div>
  <div class="keys">
    <button class="clear" data-do="clear">C</button>
    <button data-do="back">⌫</button>
    <button class="op" data-v="%">%</button>
    <button class="op" data-v="/">÷</button>
    <button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button>
    <button class="op" data-v="*">×</button>
    <button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button>
    <button class="op" data-v="-">−</button>
    <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button>
    <button class="op" data-v="+">+</button>
    <button data-v="0">0</button><button data-v=".">.</button>
    <button class="eq" data-do="equals">=</button>
  </div>
</div>
<script>
  const now = document.getElementById("now");
  const prev = document.getElementById("prev");
  let expr = "";

  function show() {
    now.textContent = expr.replace(/\*/g, "×").replace(/\//g, "÷") || "0";
  }

  // Works out the sum safely: only numbers and + − × ÷ % are allowed.
  function calculate(text) {
    if (!/^[\d+\-*/.% ]+$/.test(text)) return "Error";
    const result = Function(`"use strict"; return (${text.replace(/%/g, "/100")})`)();
    return Number.isFinite(result) ? String(Math.round(result * 1e10) / 1e10) : "Error";
  }

  document.querySelector(".keys").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.v) expr += b.dataset.v;
    if (b.dataset.do === "clear") { expr = ""; prev.textContent = ""; }
    if (b.dataset.do === "back") expr = expr.slice(0, -1);
    if (b.dataset.do === "equals" && expr) {
      prev.textContent = now.textContent + " =";
      try { expr = calculate(expr); } catch { expr = "Error"; }
      if (expr === "Error") { show(); expr = ""; return; }
    }
    show();
  });

  // Keyboard works too
  document.addEventListener("keydown", (e) => {
    if (/^[\d+\-*/.%]$/.test(e.key)) expr += e.key;
    else if (e.key === "Enter" || e.key === "=") document.querySelector(".eq").click();
    else if (e.key === "Backspace") expr = expr.slice(0, -1);
    else if (e.key === "Escape") expr = "";
    show();
  });
</script>
</body>
</html>
