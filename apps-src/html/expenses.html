<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f8fafc; font-family: system-ui, sans-serif; display: flex; justify-content: center; padding: 24px 12px; }
  .app { width: min(460px, 100%); }
  .balance { background: #4f46e5; color: #fff; border-radius: 16px; padding: 20px; text-align: center; }
  .balance h2 { margin: 4px 0; font-size: 34px; }
  .split { display: flex; justify-content: space-around; margin-top: 10px; }
  .in { color: #bbf7d0; } .out { color: #fecaca; }
  form { background: #fff; border-radius: 16px; padding: 16px; margin: 16px 0; display: grid; gap: 8px; box-shadow: 0 4px 12px #0001; }
  input, select, button { padding: 10px; font-size: 16px; border-radius: 10px; border: 2px solid #e2e8f0; }
  button { background: #4f46e5; color: #fff; border: 0; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { background: #fff; margin: 6px 0; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; border-left: 6px solid; }
  li.plus { border-color: #22c55e; } li.minus { border-color: #ef4444; }
  li button { background: none; color: #999; padding: 0 6px; }
</style>
</head>
<body>
<div class="app">
  <div class="balance">Balance<h2 id="balance">₹0</h2>
    <div class="split"><div>Income<div class="in" id="income">₹0</div></div><div>Spent<div class="out" id="spent">₹0</div></div></div>
  </div>
  <form id="form">
    <input id="what" placeholder="What for? (e.g. Groceries)" required>
    <input id="amount" type="number" step="0.01" placeholder="Amount" required>
    <select id="type"><option value="-1">Expense</option><option value="1">Income</option></select>
    <button>Add</button>
  </form>
  <ul id="list"></ul>
</div>
<script>
  let items = [];
  try { items = JSON.parse(localStorage.getItem("expenses")) || []; } catch {}
  const money = (n) => "₹" + n.toLocaleString("en-IN", { maximumFractionDigits: 2 });

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    let income = 0, spent = 0;
    items.forEach((it, i) => {
      if (it.amount > 0) income += it.amount; else spent -= it.amount;
      const li = document.createElement("li");
      li.className = it.amount > 0 ? "plus" : "minus";
      const text = document.createElement("span");
      text.textContent = `${it.what}  ${it.amount > 0 ? "+" : "−"}${money(Math.abs(it.amount))}`;
      const del = document.createElement("button");
      del.textContent = "✕";
      del.onclick = () => { items.splice(i, 1); save(); };
      li.append(text, del);
      list.prepend(li);
    });
    document.getElementById("balance").textContent = money(income - spent);
    document.getElementById("income").textContent = money(income);
    document.getElementById("spent").textContent = money(spent);
  }
  function save() {
    try { localStorage.setItem("expenses", JSON.stringify(items)); } catch {}
    render();
  }
  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const amount = Number(document.getElementById("amount").value) * Number(document.getElementById("type").value);
    items.push({ what: document.getElementById("what").value.trim(), amount });
    e.target.reset();
    save();
  });
  render();
</script>
</body>
</html>
