<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
  header { padding: 28px 18px; background: linear-gradient(135deg, #1e3a8a, #7c3aed); text-align: center; }
  header h1 { margin: 0; font-size: clamp(24px, 6vw, 38px); }
  header p { margin: 8px auto 0; max-width: 640px; color: #dbeafe; line-height: 1.5; }
  main { max-width: 900px; margin: 0 auto; padding: 18px; display: grid; gap: 16px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 18px; color: #fbbf24; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1; min-width: 160px; padding: 10px; font-size: 15px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
  button { padding: 10px 16px; font-size: 15px; border: 0; border-radius: 10px; background: #fbbf24; color: #0f172a; cursor: pointer; font-weight: 600; }
  ul { list-style: none; padding: 0; margin: 10px 0 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #334155; }
  li span { flex: 1; }
  li .status { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #334155; cursor: pointer; }
  li .status.done { background: #166534; }
  li button { background: #ef4444; color: #fff; padding: 4px 10px; }
  #log { font-family: monospace; font-size: 13px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; color: #a7f3d0; background: #020617; padding: 10px; border-radius: 10px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 120px; background: #0f172a; border-radius: 10px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 26px; color: #fbbf24; }
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <p>{{ABOUT}}</p>
</header>
<main>
  <section class="card">
    <h2>📊 Dashboard</h2>
    <div class="stats">
      <div class="stat"><b id="total">0</b>items</div>
      <div class="stat"><b id="done">0</b>done</div>
      <div class="stat"><b id="events">0</b>events</div>
    </div>
  </section>
  <section class="card">
    <h2>🧩 Items</h2>
    <form id="form"><input id="item" placeholder="Add an item, step or record…" autocomplete="off"><button>Add</button></form>
    <ul id="list"></ul>
  </section>
  <section class="card">
    <h2>📝 Activity log</h2>
    <div id="log"></div>
  </section>
</main>
<script>
  // A starter: items you can add, tick off and delete, a dashboard and a log.
  // Change the sections and the logic below to make it do exactly what you need.
  let items = [];
  let events = 0;
  try { items = JSON.parse(localStorage.getItem("starter-items")) || []; } catch {}
  const save = () => { try { localStorage.setItem("starter-items", JSON.stringify(items)); } catch {} };

  function log(text) {
    events++;
    const el = document.getElementById("log");
    el.textContent = `[${new Date().toLocaleTimeString()}] ${text}\n` + el.textContent;
  }

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    items.forEach((it, i) => {
      const li = document.createElement("li");
      const text = document.createElement("span");
      text.textContent = it.text;
      const status = document.createElement("span");
      status.className = "status" + (it.done ? " done" : "");
      status.textContent = it.done ? "done" : "pending";
      status.onclick = () => { it.done = !it.done; log(`${it.text}: ${it.done ? "done" : "pending"}`); save(); render(); };
      const del = document.createElement("button");
      del.textContent = "✕";
      del.onclick = () => { log(`Removed ${it.text}`); items.splice(i, 1); save(); render(); };
      li.append(text, status, del);
      list.append(li);
    });
    document.getElementById("total").textContent = items.length;
    document.getElementById("done").textContent = items.filter((x) => x.done).length;
    document.getElementById("events").textContent = events;
  }

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("item");
    const text = input.value.trim();
    if (!text) return;
    items.push({ text, done: false });
    log(`Added ${text}`);
    input.value = "";
    save();
    render();
  });

  log("{{TITLE}} started");
  render();
</script>
</body>
</html>
