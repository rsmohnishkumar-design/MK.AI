<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic Light Simulator</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 16px; }
  .wrap { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .pole { background: #111827; border: 4px solid #374151; border-radius: 26px; padding: 16px; display: grid; gap: 14px; }
  .lamp { width: 84px; height: 84px; border-radius: 50%; background: #1f2937; transition: background .2s, box-shadow .2s; }
  .red.on { background: #ef4444; box-shadow: 0 0 40px #ef4444; }
  .yellow.on { background: #facc15; box-shadow: 0 0 40px #facc15; }
  .green.on { background: #22c55e; box-shadow: 0 0 40px #22c55e; }
  .panel { width: min(320px, 90vw); background: #1e293b; border-radius: 14px; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 10px; color: #fbbf24; }
  .state { font-size: 28px; font-weight: 700; margin: 6px 0; }
  .timer { font-size: 15px; color: #94a3b8; }
  label { display: flex; justify-content: space-between; margin: 10px 0 4px; font-size: 14px; }
  input[type=range] { width: 100%; }
  button { width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; background: #334155; color: #e2e8f0; }
  button.walk { background: #16a34a; }
  .walker { font-size: 34px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="pole" aria-label="Traffic light">
    <div class="lamp red" id="red"></div>
    <div class="lamp yellow" id="yellow"></div>
    <div class="lamp green" id="green"></div>
  </div>
  <div class="panel">
    <h1>Traffic Light Simulator</h1>
    <div class="state" id="state">RED</div>
    <div class="timer" id="timer"></div>
    <div class="walker" id="walker">🚶‍♂️ Don't walk</div>
    <label>Red <span id="rv">8 s</span></label><input type="range" id="r" min="3" max="20" value="8">
    <label>Green <span id="gv">8 s</span></label><input type="range" id="g" min="3" max="20" value="8">
    <label>Yellow <span id="yv">3 s</span></label><input type="range" id="y" min="1" max="6" value="3">
    <button class="walk" id="walk">Pedestrian: press to cross</button>
    <button id="pause">Pause</button>
  </div>
</div>
<script>
  // Red → Green → Yellow → Red. A pedestrian press shortens green.
  const order = ["red", "green", "yellow"];
  const t = { red: 8, green: 8, yellow: 3 };
  let phase = 0, left = t.red, paused = false, walkRequest = false;
  const $ = (id) => document.getElementById(id);
  for (const [id, key] of [["r", "red"], ["g", "green"], ["y", "yellow"]]) {
    $(id).oninput = () => { t[key] = Number($(id).value); $(id + "v").textContent = t[key] + " s"; };
  }
  function draw() {
    const name = order[phase];
    for (const c of order) $(c).classList.toggle("on", c === name);
    $("state").textContent = name.toUpperCase();
    $("state").style.color = { red: "#ef4444", yellow: "#facc15", green: "#22c55e" }[name];
    $("timer").textContent = `${left} s left${walkRequest ? " · pedestrian waiting" : ""}`;
    $("walker").textContent = name === "red" ? "🚶 Walk now" : "🧍 Don't walk";
  }
  $("walk").onclick = () => {
    walkRequest = true;
    if (order[phase] === "green" && left > 3) left = 3;
    draw();
  };
  $("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "Resume" : "Pause"; };
  setInterval(() => {
    if (paused) return;
    left--;
    if (left <= 0) {
      phase = (phase + 1) % 3;
      if (order[phase] === "red") walkRequest = false;
      left = t[order[phase]];
    }
    draw();
  }, 1000);
  draw();
</script>
</body>
</html>
