<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown Timer</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f9fafb; font-family: system-ui, sans-serif; }
  .box { text-align: center; padding: 16px; }
  .inputs input { width: 70px; font-size: 22px; padding: 8px; text-align: center; border-radius: 8px; border: 0; margin: 4px; }
  #display { font-size: clamp(56px, 16vw, 110px); font-variant-numeric: tabular-nums; margin: 20px 0; }
  button { font-size: 18px; padding: 12px 22px; margin: 4px; border: 0; border-radius: 10px; cursor: pointer; background: #6366f1; color: #fff; }
  .done { color: #f87171; animation: blink 0.5s infinite alternate; }
  @keyframes blink { to { opacity: 0.2; } }
</style>
</head>
<body>
<div class="box">
  <div class="inputs">
    <input id="min" type="number" min="0" value="5" aria-label="minutes"> min
    <input id="sec" type="number" min="0" max="59" value="0" aria-label="seconds"> sec
  </div>
  <div id="display">05:00</div>
  <button id="start">Start</button>
  <button id="pause">Pause</button>
  <button id="reset">Reset</button>
</div>
<script>
  const display = document.getElementById("display");
  let left = 0, timer = null;

  const show = () => {
    display.textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
  };
  function beep() {
    // A short beep using the Web Audio API (no sound file needed)
    try {
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      osc.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.start();
      osc.stop(ctx.currentTime + 0.6);
    } catch {}
  }
  document.getElementById("start").onclick = () => {
    if (timer) return;
    if (!left) left = Number(document.getElementById("min").value) * 60 + Number(document.getElementById("sec").value);
    if (!left) return;
    display.classList.remove("done");
    timer = setInterval(() => {
      left--;
      show();
      if (left <= 0) {
        clearInterval(timer);
        timer = null;
        display.textContent = "Time's up!";
        display.classList.add("done");
        beep();
      }
    }, 1000);
    show();
  };
  document.getElementById("pause").onclick = () => { clearInterval(timer); timer = null; };
  document.getElementById("reset").onclick = () => {
    clearInterval(timer);
    timer = null;
    left = 0;
    display.classList.remove("done");
    display.textContent = `${String(document.getElementById("min").value).padStart(2, "0")}:${String(document.getElementById("sec").value).padStart(2, "0")}`;
  };
</script>
</body>
</html>
