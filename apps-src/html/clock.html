<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Clock</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle, #1f2937, #000); color: #34d399; font-family: "Courier New", monospace; }
  .clock { text-align: center; }
  #time { font-size: clamp(48px, 15vw, 120px); text-shadow: 0 0 20px #34d39988; }
  #date { font-size: clamp(16px, 4vw, 28px); color: #a7f3d0; margin-top: 8px; }
  #greet { font-size: 20px; color: #fbbf24; margin-top: 16px; }
</style>
</head>
<body>
<div class="clock">
  <div id="time"></div>
  <div id="date"></div>
  <div id="greet"></div>
</div>
<script>
  function tick() {
    const now = new Date();
    document.getElementById("time").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    document.getElementById("date").textContent = now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    const h = now.getHours();
    document.getElementById("greet").textContent = h < 12 ? "Good morning ☀️" : h < 17 ? "Good afternoon 🌤️" : h < 21 ? "Good evening 🌆" : "Good night 🌙";
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
