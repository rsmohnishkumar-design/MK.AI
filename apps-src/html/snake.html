<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Game</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #052e16; color: #dcfce7; font-family: system-ui, sans-serif; touch-action: none; }
  canvas { background: #14532d; border-radius: 10px; width: min(90vw, 400px); height: min(90vw, 400px); }
  #score { font-size: 22px; margin: 10px; }
  .pad { display: grid; grid-template-columns: repeat(3, 60px); gap: 6px; margin-top: 12px; }
  .pad button { height: 50px; font-size: 22px; border: 0; border-radius: 10px; background: #166534; color: #fff; }
  p { color: #86efac; font-size: 14px; padding: 0 12px; text-align: center; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<div class="pad">
  <span></span><button data-d="up">▲</button><span></span>
  <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
</div>
<p>Arrow keys, the buttons, or swipe. Tap the board to restart.</p>
<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const SIZE = 20, CELLS = canvas.width / SIZE;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  let snake, dir, next, food, score, alive, loop;

  function placeFood() {
    do food = [Math.floor(Math.random() * CELLS), Math.floor(Math.random() * CELLS)];
    while (snake.some(([x, y]) => x === food[0] && y === food[1]));
  }

  function start() {
    snake = [[10, 10], [9, 10], [8, 10]];
    dir = next = DIRS.right;
    score = 0;
    alive = true;
    placeFood();
    clearInterval(loop);
    loop = setInterval(step, 120);
  }

  function turn(name) {
    const d = DIRS[name];
    if (d && (d[0] !== -dir[0] || d[1] !== -dir[1])) next = d;   // can't reverse into itself
  }

  function step() {
    dir = next;
    const head = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
    const hitWall = head[0] < 0 || head[1] < 0 || head[0] >= CELLS || head[1] >= CELLS;
    if (hitWall || snake.some(([x, y]) => x === head[0] && y === head[1])) {
      alive = false;
      clearInterval(loop);
    } else {
      snake.unshift(head);
      if (head[0] === food[0] && head[1] === food[1]) { score++; placeFood(); }
      else snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = "#14532d";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(food[0] * SIZE + 2, food[1] * SIZE + 2, SIZE - 4, SIZE - 4);
    snake.forEach(([x, y], i) => {
      ctx.fillStyle = i === 0 ? "#bef264" : "#4ade80";
      ctx.fillRect(x * SIZE + 1, y * SIZE + 1, SIZE - 2, SIZE - 2);
    });
    document.getElementById("score").textContent = alive ? `Score: ${score}` : `Game over! Score: ${score}`;
  }

  document.addEventListener("keydown", (e) => {
    const name = e.key.replace("Arrow", "").toLowerCase();
    if (DIRS[name]) { e.preventDefault(); turn(name); }
  });
  document.querySelector(".pad").addEventListener("click", (e) => e.target.dataset.d && turn(e.target.dataset.d));
  // Swipe on phones and tablets
  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => (touchStart = [e.touches[0].clientX, e.touches[0].clientY]));
  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart[0];
    const dy = e.changedTouches[0].clientY - touchStart[1];
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : dy > 0 ? "down" : "up");
    else if (!alive) start();
  });
  canvas.addEventListener("click", () => !alive && start());
  start();
</script>
</body>
</html>
