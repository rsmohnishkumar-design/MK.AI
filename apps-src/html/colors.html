<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Palette Generator</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; }
  .palette { flex: 1; display: flex; flex-wrap: wrap; }
  .swatch { flex: 1 1 120px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 30px; cursor: pointer; font: 600 18px monospace; }
  .bar { padding: 14px; text-align: center; background: #111; color: #fff; }
  button { padding: 10px 22px; font-size: 16px; border: 0; border-radius: 999px; cursor: pointer; }
</style>
</head>
<body>
<div class="palette" id="palette"></div>
<div class="bar"><button id="new">New palette (or press space)</button> <span id="msg">Tap a colour to copy it</span></div>
<script>
  const random = () => "#" + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, "0");
  // Dark text on light colours, light text on dark ones
  function textColor(hex) {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
    return r * 0.299 + g * 0.587 + b * 0.114 > 150 ? "#111" : "#fff";
  }
  function make() {
    const box = document.getElementById("palette");
    box.innerHTML = "";
    for (let i = 0; i < 5; i++) {
      const c = random();
      const s = document.createElement("div");
      s.className = "swatch";
      s.style.background = c;
      s.style.color = textColor(c);
      s.textContent = c.toUpperCase();
      s.onclick = () => navigator.clipboard.writeText(c).then(() => (document.getElementById("msg").textContent = `Copied ${c}`)).catch(() => {});
      box.append(s);
    }
  }
  document.getElementById("new").onclick = make;
  document.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); make(); } });
  make();
</script>
</body>
</html>
