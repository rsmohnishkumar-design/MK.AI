<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rock Paper Scissors</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fdf2f8; font-family: system-ui, sans-serif; }
  .game { text-align: center; padding: 16px; }
  .choices button { font-size: 48px; width: 90px; height: 90px; margin: 8px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 4px 12px #0002; cursor: pointer; }
  .choices button:active { transform: scale(0.92); }
  #result { font-size: 24px; margin: 18px 0 6px; min-height: 32px; }
  #detail { font-size: 18px; color: #555; min-height: 26px; }
  #score { font-size: 20px; margin-top: 12px; }
</style>
</head>
<body>
<div class="game">
  <h1>✊ ✋ ✌️</h1>
  <div class="choices">
    <button data-pick="rock" aria-label="rock">✊</button>
    <button data-pick="paper" aria-label="paper">✋</button>
    <button data-pick="scissors" aria-label="scissors">✌️</button>
  </div>
  <div id="result">Pick one!</div>
  <div id="detail"></div>
  <div id="score">You 0 : 0 Computer</div>
</div>
<script>
  const EMOJI = { rock: "✊", paper: "✋", scissors: "✌️" };
  const BEATS = { rock: "scissors", paper: "rock", scissors: "paper" };
  let you = 0, computer = 0;

  document.querySelector(".choices").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const mine = b.dataset.pick;
    const theirs = Object.keys(EMOJI)[Math.floor(Math.random() * 3)];
    let result;
    if (mine === theirs) result = "It's a draw 🤝";
    else if (BEATS[mine] === theirs) { result = "You win! 🎉"; you++; }
    else { result = "Computer wins 🤖"; computer++; }
    document.getElementById("result").textContent = result;
    document.getElementById("detail").textContent = `You ${EMOJI[mine]}  vs  ${EMOJI[theirs]} Computer`;
    document.getElementById("score").textContent = `You ${you} : ${computer} Computer`;
  });
</script>
</body>
</html>
