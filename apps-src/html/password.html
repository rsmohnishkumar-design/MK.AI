<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Generator</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
  .card { width: min(400px, 92vw); background: #1e293b; border-radius: 16px; padding: 24px; }
  #out { font-family: monospace; font-size: 20px; background: #0f172a; padding: 14px; border-radius: 10px; word-break: break-all; min-height: 24px; }
  label { display: block; margin: 10px 0; }
  button { padding: 12px 18px; font-size: 16px; border: 0; border-radius: 10px; background: #22c55e; color: #fff; cursor: pointer; margin-top: 10px; }
  #strength { margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Password Generator</h1>
  <div id="out"></div>
  <div id="strength"></div>
  <label>Length: <input id="len" type="range" min="6" max="40" value="16"> <span id="lenVal">16</span></label>
  <label><input type="checkbox" id="upper" checked> Capital letters</label>
  <label><input type="checkbox" id="nums" checked> Numbers</label>
  <label><input type="checkbox" id="syms" checked> Symbols</label>
  <button id="make">Generate</button> <button id="copy">Copy</button>
</div>
<script>
  const SETS = { lower: "abcdefghijkmnopqrstuvwxyz", upper: "ABCDEFGHJKLMNPQRSTUVWXYZ", nums: "23456789", syms: "!@#$%^&*()-_=+?" };

  function generate() {
    let chars = SETS.lower;
    for (const k of ["upper", "nums", "syms"]) if (document.getElementById(k).checked) chars += SETS[k];
    const len = Number(document.getElementById("len").value);
    // crypto.getRandomValues is truly random (better than Math.random for passwords)
    const random = crypto.getRandomValues(new Uint32Array(len));
    const password = [...random].map((r) => chars[r % chars.length]).join("");
    document.getElementById("out").textContent = password;
    const bits = Math.round(len * Math.log2(chars.length));
    document.getElementById("strength").textContent = bits >= 80 ? "💪 Very strong" : bits >= 60 ? "👍 Strong" : "⚠️ Could be stronger";
  }

  document.getElementById("len").oninput = (e) => { document.getElementById("lenVal").textContent = e.target.value; generate(); };
  document.getElementById("make").onclick = generate;
  document.getElementById("copy").onclick = () => navigator.clipboard.writeText(document.getElementById("out").textContent).catch(() => {});
  generate();
</script>
</body>
</html>
