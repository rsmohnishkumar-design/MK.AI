<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MK.ai</title>
<meta name="description" content="Ask anything — an AI assistant that learns from every conversation." />
<meta name="theme-color" content="#14181c" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MK.ai" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=22" />
</head>
<body class="chat-page">
  <div class="app" id="appRoot">

    <section id="authScreen" class="auth-screen">
      <div class="auth-card">
        <svg class="logo logo-auth" width="64" height="64" viewBox="0 0 100 100" role="img" aria-label="MK.ai"><circle cx="50" cy="50" r="46" fill="none" stroke="#c9a227" stroke-width="3" opacity="0.55"/><text x="50" y="52" text-anchor="middle" dominant-baseline="central" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="36" fill="#c9a227" letter-spacing="-1">MK</text></svg>
        <h1>MK.ai</h1>
        <p class="auth-copy" id="authCopy">Sign in to start asking.</p>

        <div class="auth-tabs">
          <button type="button" class="auth-tab active" id="tabLogin">Log in</button>
          <button type="button" class="auth-tab" id="tabSignup">Sign up</button>
        </div>

        <form id="authForm">
          <input id="authEmail" type="email" placeholder="email" autocomplete="username" required />
          <input id="authPassword" type="password" placeholder="password" autocomplete="current-password" required />
          <input id="authCode" type="text" placeholder="access code (optional)" autocomplete="off" />
          <button type="submit" id="authSubmit">Log in</button>
        </form>
        <p class="auth-hint">Have an access code for unlimited use? Enter it above — otherwise every new account gets a 3-hour trial.</p>
        <p id="authError" class="auth-error"></p>
        <button type="button" id="forgotBtn" class="link-btn">Forgot password?</button>
      </div>
    </section>

    <div id="chatScreen" class="chat-layout hidden">
      <aside class="sidebar" id="sidebar" aria-label="Chats">
        <div class="sidebar-top">
          <div class="brand">
            <svg class="logo logo-brand" id="secretMark" width="34" height="34" viewBox="0 0 100 100" role="img" aria-label="MK.ai"><circle cx="50" cy="50" r="46" fill="none" stroke="#c9a227" stroke-width="3" opacity="0.55"/><text x="50" y="52" text-anchor="middle" dominant-baseline="central" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="36" fill="#c9a227" letter-spacing="-1">MK</text></svg>
            <span class="brand-name">MK.ai</span>
          </div>
          <button type="button" class="icon-btn" id="sidebarClose" title="Close sidebar" aria-label="Close sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M16 10l-2 2 2 2"/></svg>
          </button>
        </div>

        <button type="button" class="new-chat-btn" id="newChatBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New chat
        </button>

        <div class="chat-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
          <input id="chatSearch" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats" />
        </div>

        <nav class="chat-list" id="chatList"></nav>

        <div class="sidebar-bottom">
          <div class="account">
            <span class="account-avatar" id="accountAvatar">M</span>
            <div class="account-text">
              <span class="account-email" id="accountEmail"></span>
              <span id="tierBadge" class="tier-badge"></span>
            </div>
          </div>
          <div class="account-actions">
            <button type="button" id="installBtn" class="side-btn hidden" title="Install MK.ai as an app">install app</button>
            <button type="button" id="signOutBtn" class="side-btn" title="Sign out">sign out</button>
          </div>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <div class="chat-main">
        <header class="topbar">
          <button type="button" class="icon-btn" id="sidebarOpen" title="Open sidebar" aria-label="Open sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
          </button>
          <div class="topbar-title" id="chatTitle">New chat</div>
          <button type="button" class="icon-btn" id="newChatTop" title="New chat" aria-label="New chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
        </header>

        <main class="reading-room" id="thread" aria-live="polite">
          <div class="empty-state" id="emptyState">
            <svg class="logo logo-empty" width="76" height="76" viewBox="0 0 100 100" role="img" aria-label="MK.ai"><circle cx="50" cy="50" r="46" fill="none" stroke="#c9a227" stroke-width="3" opacity="0.55"/><text x="50" y="52" text-anchor="middle" dominant-baseline="central" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="36" fill="#c9a227" letter-spacing="-1">MK</text></svg>
            <h2 class="empty-title" id="emptyTitle">How can I help you today?</h2>
            <p>Say hi, ask a question, try some maths — or teach me something new.</p>
          </div>
        </main>

        <form class="desk" id="composer">
          <div class="desk-box">
            <textarea
              id="question"
              rows="1"
              autocomplete="off"
              placeholder="Ask me anything…"
              aria-label="Your question"
            ></textarea>
            <button type="submit" id="sendBtn" title="Send" aria-label="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
          <p class="desk-hint">Enter to send · Shift + Enter for a new line</p>
        </form>
      </div>
    </div>
  </div>

  <template id="msg-user">
    <div class="msg msg-user">
      <div class="msg-label">you</div>
      <div class="msg-body"></div>
    </div>
  </template>

  <template id="msg-ai">
    <div class="msg msg-bot">
      <div class="card">
        <div class="card-spine"></div>
        <div class="card-content">
          <div class="msg-label">mk.ai</div>
          <div class="msg-body ai-answer"></div>
          <div class="answer-credit hidden"></div>
          <form class="teach-form hidden">
            <textarea rows="2" placeholder="Type the answer and I'll remember it…"></textarea>
            <button type="submit">Teach MK.ai</button>
          </form>
          <div class="search-suggestions hidden"></div>
          <div class="answer-actions">
            <button type="button" class="vote-btn" data-vote="up" title="Helpful" aria-label="Helpful">👍</button>
            <button type="button" class="vote-btn" data-vote="down" title="Not helpful" aria-label="Not helpful">👎</button>
            <button type="button" class="copy-btn">copy</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="msg-loading">
    <div class="msg msg-bot msg-loading">
      <div class="card">
        <div class="card-spine"></div>
        <div class="card-content">
          <div class="msg-label">mk.ai</div>
          <div class="pulling">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            thinking…
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="msg-error">
    <div class="msg msg-bot msg-error">
      <div class="card card-error">
        <div class="card-spine"></div>
        <div class="card-content">
          <div class="msg-label">mk.ai</div>
          <div class="msg-body"></div>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="js/app.js?v=22"></script>
</body>
</html>
